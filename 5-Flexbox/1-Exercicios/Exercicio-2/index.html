<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão Flexbox - Layout de Blocos</title>
</head>
<body>

    <!-- 1. Linha Superior: 3 Caixas (Distribuição igualitária) -->
    <header class="superior">
        <div class="caixa caixa-top">Topo A</div>
        <div class="caixa caixa-top">Topo B</div>
        <div class="caixa caixa-top">Topo C</div>
    </header>

    <!-- 2. Linha Central: 2 Caixas (Proporção 2/3 e 1/3) -->
    <main class="central">
        <section class="caixa conteudo-principal">Conteúdo Principal (2/3)</section>
        <section class="caixa barra-lateral">Barra Lateral (1/3)</section>
    </main>

    <!-- 3. Linha Inferior: 4 Caixas (Responsivas com Wrap) -->
    <footer class="inferior">
        <div class="caixa caixa-bot">Card 1</div>
        <div class="caixa caixa-bot">Card 2</div>
        <div class="caixa caixa-bot">Card 3</div>
        <div class="caixa caixa-bot">Card 4</div>
    </footer>

</body>
</html>
